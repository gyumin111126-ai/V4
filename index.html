<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>장부 시즌 2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;background:#17110c;color:#fff}button{font:inherit;cursor:pointer}.game{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#315b3c 0,#173b28 45%,#0c2117 78%,#08140e 100%)}
/* 전통 화투판 느낌의 바닥 */
.game:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(220,210,170,.018) 0 2px,transparent 2px 7px),radial-gradient(circle at 50% 50%,transparent 25%,rgba(0,0,0,.42) 100%);pointer-events:none}.game:after{content:"";position:absolute;left:50%;top:50%;width:min(94vw,1180px);height:min(70vh,760px);transform:translate(-50%,-50%);border:2px solid rgba(206,170,105,.18);border-radius:34px;box-shadow:inset 0 0 0 8px rgba(50,12,7,.18);pointer-events:none}
.table{position:absolute;left:7%;right:7%;top:16%;bottom:18%;border-radius:34px;background:linear-gradient(145deg,#244b32,#1d432c 48%,#153522);border:7px solid #3b2718;box-shadow:inset 0 0 0 2px #87613b,inset 0 0 55px #09170f,0 16px 40px #000b}.table:before{content:"";position:absolute;inset:11px;border:2px solid rgba(190,157,94,.28);border-radius:23px}.table:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:18px;letter-spacing:13px;color:#f6d39a;opacity:0;white-space:nowrap}
/* 중앙 */.center{position:absolute;z-index:30;left:50%;top:48%;transform:translate(-50%,-50%);text-align:center;min-width:190px}.potlabel{font-size:11px;color:#f3d5a4;letter-spacing:1px}.pot{font-size:30px;font-weight:1000;color:#ffd86c;text-shadow:0 3px 4px #3b0e07;margin:1px 0}.call{display:inline-flex;gap:7px;align-items:center;padding:5px 12px;border-radius:14px;background:#35130ee8;border:1px solid #ad6536;color:#e9c99d;font-size:12px}.call b{color:#ffe38c;font-size:15px}.centerBtns{display:flex;justify-content:center;gap:7px;margin-top:8px}.win,.undo{height:34px;min-width:82px;border-radius:10px;border:1px solid #d39a4e;font-size:13px;font-weight:1000;padding:0 14px;box-shadow:0 4px 10px #0008}.win{background:linear-gradient(#c75b2e,#8c281b);color:#fff4db}.win.active{background:linear-gradient(#efb735,#aa620d);color:#fff}.undo{background:linear-gradient(#5a3025,#361914);color:#eed6bd}.undo[disabled]{opacity:.4}
/* 6명 자리 */.player{position:absolute;z-index:40;width:124px;text-align:center;user-select:none;transition:.15s}.p1{left:4%;top:3%;transform:rotate(180deg)}.p2{right:4%;top:3%;transform:rotate(180deg)}.p3{left:4%;top:48%;transform:translateY(-50%) rotate(90deg)}.p4{right:4%;top:48%;transform:translateY(-50%) rotate(-90deg)}.p5{left:4%;bottom:12%;transform:rotate(0deg)}.p6{right:4%;bottom:12%;transform:rotate(0deg)}.player.selected{transform:scale(1.04)}.p1.selected,.p2.selected{transform:rotate(180deg) scale(1.04)}.p3.selected{transform:translateY(-50%) rotate(90deg) scale(1.04)}.p4.selected{transform:translateY(-50%) rotate(-90deg) scale(1.04)}.p5.selected,.p6.selected{transform:rotate(0deg) scale(1.04)}.player.folded{opacity:.4}.seat{padding:2px 4px 3px;border-radius:13px;background:linear-gradient(180deg,#32150fef,#1d0c09f2);border:1px solid #a45c32;box-shadow:0 7px 16px #0009}.avatar{width:32px;height:32px;margin:-20px auto 2px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 25%,#f0c979,#9d3f25 60%,#4b1711);border:2px solid #f0c979;box-shadow:0 3px 8px #0008;font-size:17px}.name{font-size:10px;font-weight:1000;color:#eadfc9}.money{font-size:15px;font-weight:1000;color:#f0d27b}.bet{font-size:10px;color:#cba987}.badge{display:inline-block;margin-top:2px;padding:2px 8px;border-radius:9px;background:#4a1a16;color:#e7a894;font-size:10px;font-weight:1000;letter-spacing:.3px}.status-call{background:#315d43;color:#d8f0d8}.status-allin{background:#806238;color:#ffe0a1}.status-die{background:#4a1a16;color:#e7a894}.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:4px;width:128%;margin-left:-14%}.actions button{height:30px;min-width:0;padding:0 3px;border-radius:7px;border:1px solid #b77a48;color:#fff;font-size:9px;font-weight:1000;box-shadow:0 2px 4px #0007;white-space:nowrap}.callbtn{background:#315d43}.halfbtn{background:#4d654e}.allbtn{background:#806238}.checkbtn{background:#315d43}.diebtn{background:#704039}.actions button:disabled{opacity:.35;filter:grayscale(1)}.checkedState{margin-top:4px;padding:6px 8px;border-radius:7px;background:#315d43;color:#d8f0d8;font-size:10px;font-weight:1000;letter-spacing:.2px}.status-wait{background:#315d43;color:#d8f0d8}
.impact{position:absolute;z-index:170;left:50%;top:50%;transform:translate(-50%,-50%) scale(.75);font-size:clamp(30px,7vw,72px);font-weight:1000;letter-spacing:3px;color:#ffe7a3;text-shadow:0 4px 0 #5b180d,0 0 28px #ff8b3d;background:rgba(25,7,4,.92);border:2px solid #d8954e;border-radius:18px;padding:20px 30px;opacity:0;pointer-events:none;transition:.12s}.impact.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.centerStatus{margin-top:6px;min-height:18px;font-size:11px;font-weight:1000;color:#f3d5a4}.centerStatus.duel{color:#ffd36d}.winnerHint{position:absolute;z-index:160;left:50%;top:36%;transform:translateX(-50%);padding:7px 13px;border-radius:12px;background:#2a110ce8;border:1px solid #d69a50;color:#ffe2a8;font-size:12px;font-weight:1000;opacity:0;pointer-events:none}.winnerHint.show{opacity:1}.player.winTarget .seat{box-shadow:0 0 0 2px #f0c15a,0 0 22px #d77d2f;animation:targetPulse .7s infinite alternate}.player.allin .seat:after{content:"ALL IN";position:absolute;left:50%;top:-8px;transform:translateX(-50%);padding:2px 7px;border-radius:8px;background:#a85a28;border:1px solid #f0c15a;color:#fff1bd;font-size:8px;font-weight:1000;letter-spacing:.5px}@keyframes targetPulse{from{filter:brightness(1)}to{filter:brightness(1.35)}}.player.allin .seat{border-color:#e1b65f;box-shadow:0 0 0 1px #e1b65f,0 0 14px #a85a28}.player.folded .seat{border-style:dashed}.toast{position:absolute;z-index:90;left:50%;top:9%;transform:translateX(-50%);background:#210d09ee;border:1px solid #bd7642;border-radius:11px;padding:8px 14px;color:#ffe4bd;font-size:12px;font-weight:900;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
.setup{position:absolute;inset:0;z-index:100;background:#170a07ee;display:flex;align-items:center;justify-content:center;padding:20px}.panel{width:min(450px,94vw);padding:23px;border-radius:18px;background:linear-gradient(#351711,#1e0c09);border:1px solid #c17a42;box-shadow:0 20px 60px #000}.panel h1{text-align:center;margin:0;color:#ffd989}.sub{text-align:center;color:#c9aa89;font-size:12px;margin:5px 0 16px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.inputs input,.moneyInput{width:100%;padding:10px;border-radius:8px;border:1px solid #815137;background:#190b08;color:#fff;outline:0}.start{width:100%;margin-top:10px;padding:12px;border:1px solid #e1a55d;border-radius:10px;background:linear-gradient(#c9652e,#8d2c1d);color:#fff3d2;font-weight:1000}.hint{text-align:center;color:#a98970;font-size:10px;line-height:1.5;margin-top:9px}
@media(max-width:800px){.table{left:4%;right:4%;top:15%;bottom:15%;border-width:6px}.player{width:106px}.seat{padding:3px 4px}.avatar{width:30px;height:30px;font-size:14px}.money{font-size:14px}.actions button{height:30px;font-size:9px}.p1,.p5{left:1%}.p2,.p6{right:1%}.center{top:48%}}@media(max-height:650px){.table{top:11%;bottom:15%}.player{width:105px}.seat{padding:3px 4px}.avatar{width:34px;height:34px;margin-top:-17px}.actions{margin-top:4px}.actions button{height:28px}.center{top:48%}.pot{font-size:25px}}

/* 장부 1의 개발자 정보 */
.dev-page{position:absolute;inset:0;z-index:200;background:#10150f;display:none;align-items:center;justify-content:center;padding:20px}
.dev-page.show{display:flex}
.dev-card{text-align:center;width:min(360px,90vw);padding:24px 16px;border-radius:16px;background:#182019;border:1px solid #8b6842;box-shadow:0 20px 60px #000}
.dev-title{font-size:24px;font-weight:900;margin:0 0 18px;color:#f0d59b}
.dev-image{width:min(220px,70vw);aspect-ratio:1/1;object-fit:cover;border-radius:20px;display:block;margin:0 auto 16px;border:1px solid #8b6842}
.dev-name{font-size:12px;color:#c9b99e;margin:0 0 22px}
.back-btn{width:100%;background:#31523a;color:#fff;border:1px solid #8b6842;padding:10px;border-radius:9px}
.dev-link{position:absolute;left:12px;bottom:10px;z-index:130;padding:6px 10px;border-radius:8px;border:1px solid #8f6b45;background:#18251c;color:#d8c8ad;font-size:10px}

/* 게임 종료 연출 / 방금 판 전적 */
.result-overlay{position:absolute;inset:0;z-index:180;display:none;align-items:center;justify-content:center;background:rgba(5,8,6,.86);text-align:center;padding:20px}
.result-overlay.show{display:flex}
.result-box{width:min(430px,90vw);padding:24px 18px;border-radius:16px;background:linear-gradient(#1c241d,#101510);border:1px solid #8b6842;box-shadow:0 20px 60px #000}
.last-rank-title{font-size:22px;font-weight:1000;color:#f0d59b;margin-bottom:12px}
.rank-list{display:grid;gap:6px;text-align:left}.rank-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;background:#182019;border:1px solid #314234}.rank-num{width:22px;font-weight:1000;color:#d8bd86}.rank-name{flex:1;font-weight:900}.rank-money{font-weight:1000;color:#efd078}
.setup-history{margin-top:14px;padding-top:12px;border-top:1px solid #503b2a}.setup-history h3{margin:0 0 7px;font-size:12px;color:#d7bd91}.setup-history .rank-row{background:#151c16;padding:6px 8px;font-size:11px}

/* v17 리뉴얼 */
.badge.status-call{background:#315d43;color:#dff5e5;border-color:#6ea883}.badge.status-die{background:#632a22;color:#ffd4cb;border-color:#a65a4c}.badge.status-allin{background:#8a5a20;color:#ffe7ad;border-color:#e0b65e}.badge.status-wait{background:#3a3026;color:#d8c7b0;border-color:#6f5c47}
.player.winTarget{z-index:60}.player.winTarget .seat{cursor:pointer}
.round-chip{display:inline-block;margin-left:4px;padding:2px 6px;border-radius:7px;background:#27130e;border:1px solid #765033;color:#d8b987;font-size:9px}

/* 태블릿 가로모드 최적화 */
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
  .table{left:2.5%;right:2.5%;top:7%;bottom:8%;border-width:6px;border-radius:30px}
  .player{width:88px}
  .p1{left:4%;top:2%}
  .p2{right:4%;top:2%}
  .p3{left:4%;top:48%}
  .p4{right:4%;top:48%}
  .p5{left:4%;bottom:12%}
  .p6{right:4%;bottom:12%}
  .seat{padding:2px 3px 3px;border-radius:11px}
  .avatar{width:28px;height:28px;font-size:13px;margin-top:-14px}
  .name{font-size:9px}.money{font-size:13px}.bet{font-size:9px}.badge{font-size:9px;padding:2px 6px}
  .actions{gap:3px;margin-top:3px;width:132%;margin-left:-16%}
  .actions button{height:27px;font-size:8px;padding:0 2px;border-radius:6px}
  .checkedState{margin-top:3px;padding:5px 5px;font-size:9px}
  .center{top:50%;min-width:170px}
  .pot{font-size:27px}.centerBtns{margin-top:6px}.win,.undo{height:31px;min-width:70px;font-size:12px;padding:0 10px}
  .centerStatus{margin-top:4px;font-size:10px}
}

/* 작은 태블릿/가로 화면에서도 하단 액션이 화면 밖으로 나가지 않게 */
@media (min-width:801px) and (max-height:700px) and (orientation:landscape){
  .table{top:5%;bottom:7%}
  .player{width:88px}
  .p5,.p6{bottom:12%}
  .actions button{height:24px;font-size:7px}
  .avatar{width:26px;height:26px;margin-top:-13px}
  .money{font-size:12px}.badge{font-size:8px}
  .center{transform:translate(-50%,-50%) scale(.9)}
}

/* FINAL SAFE PLAYER POSITION */
@media (min-width: 801px) and (orientation: landscape) {
  .player { width: 88px !important; }
  .p1 { left: 4% !important; top: 2% !important; }
  .p2 { right: 4% !important; top: 2% !important; }
  .p3 { left: 4% !important; top: 48% !important; }
  .p4 { right: 4% !important; top: 48% !important; }
  .p5 { left: 4% !important; bottom: 12% !important; }
  .p6 { right: 4% !important; bottom: 12% !important; }
}
@media (max-width: 800px) {
  .player { width: 92px !important; }
  .p1 { left: 3% !important; top: 2% !important; }
  .p2 { right: 3% !important; top: 2% !important; }
  .p3 { left: 3% !important; top: 46% !important; }
  .p4 { right: 3% !important; top: 46% !important; }
  .p5 { left: 3% !important; bottom: 10% !important; }
  .p6 { right: 3% !important; bottom: 10% !important; }
}

<div id="setup" class="setup"><div class="panel"><h1>장부 시즌 2</h1><div class="sub">6명 · 한 화면에서 같이 쓰는 섯다 장부</div><div class="inputs" id="nameInputs"></div><input id="startMoney" class="moneyInput" type="number" min="100" step="100" value="3000" placeholder="시작 금액"><button id="start" class="start">게임 시작</button><div class="hint">매 라운드 시작 시 각자 100냥이 가운데 모입니다.<br>첫 배팅은 50냥부터 · 콜 · 하프 · 올인 · 다이 · 모두 콜 후 승자 선택</div>

<script>const emojis=['♠','◆','●','★','▲','■'];
const ANTE=100, MIN_BET=50;
let players=[],selected=0,pot=0,maxBet=0,roundNo=0;
let phase='setup',lastWin=null,turnIndex=0,gameEnded=false;
let lastGameRanking=[],lastGameSettings=null,duelTimer=null,gameOverTimers=[];
const $=s=>document.querySelector(s);
const money=n=>Math.max(0,Math.round(n)).toLocaleString()+'냥';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1400)}
function activePlayers(){return players.filter(p=>!p.folded)}
function allInPlayers(){return activePlayers().filter(p=>p.money<=0)}
function everyoneCalled(){const a=activePlayers();return a.length>0&&maxBet>=MIN_BET&&a.every(p=>p.bet>=maxBet||p.money<=0)}
function everyoneChecked(){const a=activePlayers();return a.length>0&&everyoneCalled()&&a.every(p=>p.money<=0||p.checked)}
function rankPlayers(){return [...players].sort((a,b)=>b.money-a.money)}
function clearDuel(){if(duelTimer){clearTimeout(duelTimer);duelTimer=null}$('#impact').classList.remove('show');$('#winnerHint').classList.remove('show')}
function renderSetupHistory(){
 const box=$('#setupHistory'),replay=$('#replay');
 if(!lastGameRanking.length){box.style.display='none';replay.style.display='none';return}
 box.style.display='block';replay.style.display='block';let rank=0,lastMoney=null;
 box.innerHTML='<h3>방금 판 전적</h3>'+lastGameRanking.map((p,i)=>{if(p.money!==lastMoney){rank=i+1;lastMoney=p.money}return `<div class="rank-row"><span class="rank-num">${p.money<=0?'꼴등':rank+'위'}</span><span class="rank-name"></span><span class="rank-money">${money(p.money)}</span></div>`}).join('');
 [...box.querySelectorAll('.rank-name')].forEach((e,i)=>e.textContent=lastGameRanking[i].name);
}
function currentTurnPlayer(){return players[turnIndex]}
function setTurn(i){turnIndex=i;selected=i}
function nextTurn(from){
 const n=players.length;if(!n)return -1;
 for(let step=1;step<=n;step++){
  const i=(from+step)%n,p=players[i];if(!p||p.folded||p.money<=0||p.checked)continue;
  return i;
 }
 return -1;
}
function firstActionTurn(){
 const p=players[turnIndex];if(p&&!p.folded&&p.money>0)return turnIndex;
 const i=nextTurn(-1);if(i>=0)setTurn(i);return i;
}
function checkReady(p,i){return !!p&&!p.folded&&p.money>0&&phase==='betting'&&i===turnIndex&&everyoneCalled()&&p.bet>=maxBet&&!p.checked}
function startRound(){
 players.forEach(p=>{p.folded=false;p.checked=false;p.bet=0});
 const a=activePlayers();if(!a.length)return false;
 const unable=a.find(p=>p.money<ANTE);if(unable){gameOver(unable);return false}
 roundNo++;a.forEach(p=>{p.money-=ANTE;p.bet=0});pot=ANTE*a.length;maxBet=0;phase='betting';lastWin=null;clearDuel();
 const broke=a.find(p=>p.money<=0);if(broke){gameOver(broke);return false}
 setTurn(firstActionTurn());render();return true;
}
function render(){
 $('#roundNo').textContent=roundNo;$('#pot').textContent=money(pot);
 const current=players[selected];
 const need=current?(maxBet===0?MIN_BET:Math.max(0,maxBet-current.bet)):MIN_BET;
 $('#callCost').textContent=money(need);
 $('#win').classList.toggle('active',phase==='winner');
 $('#win').disabled=phase!=='winner'||pot<=0;
 $('#undo').disabled=!lastWin;
 const status=$('#centerStatus');status.classList.toggle('duel',phase==='duel'||phase==='winner');
 if(phase==='winner')status.textContent='전원 체크 완료 · 승자 선택';
 else if(phase==='duel')status.textContent='최후의 결전 · 승자 선택';
 else if(phase==='betting'){const t=currentTurnPlayer();status.textContent=t?'▶ '+t.name+' 차례 · '+(maxBet===0?'첫 배팅 50냥':'현재 배팅 '+money(maxBet)):'배팅 중'}
 else status.textContent='배팅 준비';
 const wrap=$('#players');wrap.innerHTML='';
 players.forEach((p,i)=>{
  const d=document.createElement('div');
  d.className=`player p${i+1}${i===selected?' selected':''}${p.folded?' folded':''}${p.money<=0&&!p.folded?' allin':''}${(phase==='winner'||phase==='duel')&&!p.folded?' winTarget':''}`;
  const matched=p.bet>=maxBet&&maxBet>=MIN_BET;
  const canCall=maxBet>0;
  const callNeed=maxBet===0?MIN_BET:Math.max(0,maxBet-p.bet);
  const callDisabled=phase!=='betting'||i!==turnIndex||p.folded||p.checked||!canCall||matched||p.money<callNeed;
  const halfNeed=Math.max(MIN_BET,maxBet-p.bet);
  const halfDisabled=phase!=='betting'||i!==turnIndex||p.folded||p.checked||p.money<halfNeed*2;
  const allinDisabled=phase!=='betting'||i!==turnIndex||p.folded||p.money<=0||p.checked;
  const checkDisabled=!checkReady(p,i);
  const statusBadge=p.folded?'다이':(p.money<=0?'올인':(p.checked?'체크':(matched?'콜':(i===turnIndex&&phase==='betting'?'차례':''))));
  d.innerHTML=`<div class="seat"><div class="avatar">${emojis[i]}</div><div class="name"></div><div class="money">${money(p.money)}</div><div class="bet">이번 판 배팅 ${money(p.bet)}</div>${statusBadge?`<div class="badge status-${statusBadge==='다이'?'die':statusBadge==='올인'?'allin':statusBadge==='체크'?'wait':'call'}">${statusBadge}</div>`:''}${p.folded?'':p.money<=0?`<div class="checkedState status-allin">✓ 올인 완료</div>`:p.checked?`<div class="checkedState">✓ 체크 완료</div>`:`<div class="actions"><button class="callbtn" data-a="call" ${callDisabled?'disabled':''}>콜${canCall&&callNeed>0?' '+money(callNeed):''}</button><button class="halfbtn" data-a="half" ${halfDisabled?'disabled':''}>하프</button><button class="allbtn" data-a="allin" ${allinDisabled?'disabled':''}>올인</button><button class="checkbtn" data-a="check" ${checkDisabled?'disabled':''}>체크</button><button class="diebtn" data-a="die">다이</button></div>`}</div>`;
  d.querySelector('.name').textContent=p.name;
  d.onclick=()=>playerClick(i);
  d.querySelectorAll('.actions button').forEach(b=>b.onclick=e=>{e.stopPropagation();if(i!==turnIndex){toast('지금은 '+(currentTurnPlayer()?.name||'다음 사람')+' 차례야');return}action(b.dataset.a)});
  wrap.appendChild(d);
 });
}
function playerClick(i){
 if(phase==='winner'||phase==='duel'){if(players[i]&&!players[i].folded)settle(i,true);else toast('다이한 사람은 승자가 될 수 없어');return}
 selected=i;render();
}
function addBet(i,amount){
 const p=players[i];if(!p||p.folded||phase!=='betting'||i!==turnIndex)return false;
 amount=Math.min(Math.max(0,Math.floor(amount)),p.money);if(amount<=0){toast('배팅할 금액이 없어');return false}
 p.money-=amount;p.bet+=amount;pot+=amount;maxBet=Math.max(maxBet,p.bet);return true;
}
function moveAfterAction(from){
 if(activePlayers().length===1){afterDie();return}
 const next=nextTurn(from);
 if(next>=0){setTurn(next);render();}
 else if(everyoneCalled()){phase='winner';render();toast('모두 체크해야 승자를 고를 수 있어')}
 else render();
}
function triggerFinalDuel(){
 const a=allInPlayers();if(a.length<2)return false;
 clearDuel();phase='duel';roundLocked=true;render();$('#impact').classList.add('show');
 duelTimer=setTimeout(()=>{$('#impact').classList.remove('show');$('#winnerHint').classList.add('show');render()},1000);return true;
}
function afterDie(){
 const a=activePlayers(),ai=allInPlayers();
 if(a.length===1){const idx=players.indexOf(a[0]);toast(a[0].name+' 독식 승!');settle(idx,false);return true}
 if(ai.length>=2&&a.length===ai.length){triggerFinalDuel();return true}
 const n=nextTurn(selected);if(n>=0)setTurn(n);render();return false;
}
function action(a){
 const p=players[turnIndex];if(!p||p.folded)return;
 if(a==='die'){p.folded=true;p.checked=false;afterDie();return}
 if(phase!=='betting'){toast('지금은 배팅할 수 없어');return}
 if(a==='check'){
  if(!checkReady(p,turnIndex)){toast('현재 콜을 맞춘 뒤 내 차례에 체크할 수 있어');return}
  p.checked=true;
  const n=nextTurn(turnIndex);
  if(n>=0){setTurn(n);render();}
  else if(everyoneChecked()){phase='winner';render();toast('모두 체크! 승자를 골라줘')}
  else render();
  return;
 }
 if(a==='allin'){
  if(addBet(turnIndex,p.money)){
   p.checked=false;
   players.forEach(x=>{if(x!==p)x.checked=false});
   const active=activePlayers();
   if(active.length===1){afterDie();return}
   if(allInPlayers().length>=2&&allInPlayers().length===active.length){triggerFinalDuel();return}
   const n=nextTurn(turnIndex);if(n>=0)setTurn(n);render();
  }
  return;
 }
 if(a==='call'){
  const need=maxBet===0?MIN_BET:Math.max(0,maxBet-p.bet);
  if(maxBet===0){toast('첫 배팅은 하프 또는 올인이야');return}
  if(p.bet>=maxBet){toast('이미 콜했어');return}
  if(addBet(turnIndex,Math.min(need,p.money))){p.checked=false;moveAfterAction(turnIndex)}
  return;
 }
 if(a==='half'){
  const need=maxBet===0?MIN_BET:Math.max(MIN_BET,maxBet-p.bet);
  const before=maxBet;
  if(addBet(turnIndex,Math.min(need*2,p.money))){p.checked=false;players.forEach(x=>x.checked=false);maxBet=Math.max(maxBet,p.bet);toast('하프! 다음 콜 '+money(maxBet));moveAfterAction(turnIndex)}
 }
}
function showRanking(){
 const list=rankPlayers();let rank=0,lastMoney=null;
 $('#resultRanking').innerHTML=list.map((p,i)=>{if(p.money!==lastMoney){rank=i+1;lastMoney=p.money}return `<div class="rank-row"><span class="rank-num">${p.money<=0?'꼴등':rank+'위'}</span><span class="rank-name"></span><span class="rank-money">${money(p.money)}</span></div>`}).join('');
 [...$('#resultRanking').querySelectorAll('.rank-name')].forEach((e,i)=>e.textContent=list[i].name+(list[i].money<=0?' · 꼴등':''));
}
function gameOver(loser){
 if(gameEnded)return;gameEnded=true;clearDuel();lastGameRanking=rankPlayers().map(p=>({...p}));lastGameSettings={names:players.map(p=>p.name),startMoney:Number($('#startMoney').value)||3000};
 const losers=players.filter(p=>p.money<=0),names=losers.map(p=>p.name).join(' · ');$('#loserTitle').textContent=(names||loser?.name||'플레이어')+' · 꼴등';$('#resultOverlay').classList.add('show');
 gameOverTimers.forEach(clearTimeout);gameOverTimers=[];
 gameOverTimers.push(setTimeout(()=>{showRanking();$('#loserTitle').textContent=losers.length>1?'방금 판 최종 랭킹 · 꼴등: '+names:'방금 판 최종 랭킹';gameOverTimers.push(setTimeout(()=>{$('#resultOverlay').classList.remove('show');$('#setup').style.display='flex';players=[];pot=0;maxBet=0;phase='setup';renderSetupHistory();gameEnded=false},2000))},2000));
}
function settle(i,allowUndo=true){
 if(!players[i]||players[i].folded||pot<=0)return;
 const canUndo=allowUndo&&phase==='winner';
 const before={players:JSON.parse(JSON.stringify(players)),pot,maxBet,phase,turnIndex,selected,roundNo};
 const winnerName=players[i].name,oldPot=pot;
 players[i].money+=pot;players.forEach(p=>{p.bet=0;p.checked=false});pot=0;maxBet=0;phase='betting';
 const wasAuto=!canUndo;
 if(players.some(p=>p.money<=0)){lastWin=null;gameOver();return}
 if(startRound()){
  lastWin=canUndo?{before,winner:i}:null;
  toast(winnerName+' 승! +'+money(oldPot)+' · 다음 판 시작');render();
 } else lastWin=null;
}
function undo(){
 if(!lastWin||gameEnded)return;
 const snap=lastWin.before;clearDuel();players=JSON.parse(JSON.stringify(snap.players));pot=snap.pot;maxBet=snap.maxBet;phase='winner';turnIndex=snap.turnIndex;selected=snap.selected;roundNo=snap.roundNo;lastWin=null;$('#winnerHint').classList.add('show');render();toast('직전 체크판의 승자 결정을 취소했어');
}
for(let i=0;i<6;i++){const x=document.createElement('input');x.placeholder=`플레이어 ${i+1} (선택)`;x.value='';x.id='n'+i;$('#nameInputs').appendChild(x)}
$('#devBtn').onclick=()=>{$('#developerPage').classList.add('show');$('#developerPage').setAttribute('aria-hidden','false')};
$('#backBtn').onclick=()=>{$('#developerPage').classList.remove('show');$('#developerPage').setAttribute('aria-hidden','true')};
function beginGame(names,startMoney){
 names=names.map(n=>String(n).trim()).filter(Boolean).slice(0,6);if(!names.length){toast('플레이어 이름을 한 명 이상 적어줘');return}
 players=names.map(name=>({name,money:startMoney,bet:0,folded:false,checked:false}));selected=0;pot=0;maxBet=0;phase='setup';lastWin=null;gameEnded=false;roundNo=0;clearDuel();
 if(startRound())$('#setup').style.display='none';
}
$('#start').onclick=()=>{const m=Math.max(ANTE,Number($('#startMoney').value)||3000);const names=Array.from({length:6},(_,i)=>$('#n'+i).value.trim()).filter(Boolean);beginGame(names,m)};
$('#replay').onclick=()=>{if(lastGameSettings)beginGame(lastGameSettings.names,lastGameSettings.startMoney)};
$('#win').onclick=()=>{if(phase!=='winner'){toast('모두 체크한 뒤 승자를 골라줘');return}$('#winnerHint').classList.add('show');render()};
$('#undo').onclick=undo;renderSetupHistory();render();</script></body></html>
