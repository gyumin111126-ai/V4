name: Apply smaller player UI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
jobs:
  tweak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply small size tweak
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''
<style>
/* FINAL SMALLER TWEAK */
@media (min-width:801px) and (orientation:landscape){
  .player{width:108px !important}
  .seat{padding:3px 4px 5px !important;border-radius:13px !important}
  .avatar{width:33px !important;height:33px !important;margin-top:-17px !important;font-size:16px !important}
  .name{font-size:10px !important}.money{font-size:14px !important}.bet{font-size:9px !important}.badge{font-size:8px !important;padding:2px 6px !important}
  .actions{width:145% !important;margin-left:-22.5% !important;gap:3px !important;margin-top:4px !important}
  .actions button{height:34px !important;font-size:9px !important;padding:0 2px !important;border-radius:7px !important}
  .checkedState{margin-top:4px !important;padding:6px 7px !important;font-size:9px !important}
}
@media (max-width:800px){
  .player{width:102px !important}
  .seat{padding:3px 4px 5px !important;border-radius:13px !important}
  .avatar{width:31px !important;height:31px !important;margin-top:-16px !important;font-size:15px !important}
  .name{font-size:9px !important}.money{font-size:14px !important}.bet{font-size:8px !important}.badge{font-size:8px !important;padding:2px 5px !important}
  .actions{width:140% !important;margin-left:-20% !important;gap:3px !important;margin-top:4px !important}
  .actions button{height:32px !important;font-size:8px !important;padding:0 2px !important;border-radius:7px !important}
  .checkedState{margin-top:4px !important;padding:5px 6px !important;font-size:8px !important}
}
</style>
'''
          if '/* FINAL SMALLER TWEAK */' not in s:
              p.write_text(s.replace('</head>',css+'</head>',1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Make player UI slightly smaller' && git push)
