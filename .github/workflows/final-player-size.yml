name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* FINAL PLAYER UI SMALLER */'
          css='''
<style>
/* FINAL PLAYER UI SMALLER */
.player{width:150px}
.seat{padding:5px 7px 7px;border-radius:15px}
.avatar{width:40px;height:40px;margin:-20px auto 4px;font-size:20px}
.name{font-size:13px}.money{font-size:18px}.bet{font-size:12px}.badge{font-size:10px;padding:2px 7px;margin-top:3px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:5px;width:125%;margin-left:-12.5%}
.actions button{height:36px;min-width:0;font-size:11px;padding:0 2px;border-radius:7px}
.checkedState{margin-top:5px;padding:6px 7px;font-size:11px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:140px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:5px 6px 6px;border-radius:14px}.avatar{width:38px;height:38px;margin-top:-19px;font-size:18px}.name{font-size:12px}.money{font-size:17px}.bet{font-size:11px}.badge{font-size:9px;padding:2px 6px}.actions{width:125%;margin-left:-12.5%;gap:3px}.actions button{height:34px;font-size:10px}.checkedState{font-size:10px;padding:5px}
}
</style>
'''
          if marker not in s:
              s=s.replace('</head>',css+'</head>',1)
          else:
              import re
              s=re.sub(r'<style>\s*/\* FINAL PLAYER UI SMALLER \*/.*?</style>\s*','',s,flags=re.S)
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Make player UI slightly smaller'
          git push
