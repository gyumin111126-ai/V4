name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* FINAL PLAYER UI MEDIUM */'
          css='''
<style>
/* FINAL PLAYER UI MEDIUM */
.player{width:175px}
.seat{padding:6px 8px 8px;border-radius:17px}
.avatar{width:46px;height:46px;margin:-23px auto 5px;font-size:23px}
.name{font-size:15px}.money{font-size:21px}.bet{font-size:14px}.badge{font-size:12px;padding:3px 9px;margin-top:4px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px;width:130%;margin-left:-15%}
.actions button{height:41px;min-width:0;font-size:12px;padding:0 3px;border-radius:8px}
.checkedState{margin-top:6px;padding:7px 9px;font-size:13px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:160px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:5px 7px 7px;border-radius:16px}.avatar{width:43px;height:43px;margin-top:-21px;font-size:21px}.name{font-size:14px}.money{font-size:20px}.bet{font-size:13px}.badge{font-size:11px;padding:2px 8px}.actions{width:130%;margin-left:-15%;gap:4px}.actions button{height:39px;font-size:11px}.checkedState{font-size:12px;padding:6px 8px}
}
</style>
'''
          s=re.sub(r'<style>\s*/\* FINAL PLAYER UI (?:SMALLER|1\.8X|MEDIUM) \*/.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Set player UI to medium size'
          git push
