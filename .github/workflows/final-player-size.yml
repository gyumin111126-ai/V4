name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style>
/* FINAL PLAYER UI 1.5X */
.player{width:235px}
.seat{padding:9px 12px 12px;border-radius:20px}
.avatar{width:62px;height:62px;margin:-31px auto 7px;font-size:30px}
.name{font-size:20px}.money{font-size:28px}.bet{font-size:18px}.badge{font-size:15px;padding:4px 11px;margin-top:5px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px;width:125%;margin-left:-12.5%}
.actions button{height:52px;min-width:0;font-size:15px;padding:0 3px;border-radius:10px}
.checkedState{margin-top:8px;padding:9px 11px;font-size:16px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:210px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:8px 10px 10px;border-radius:19px}.avatar{width:56px;height:56px;margin-top:-28px;font-size:27px}.name{font-size:18px}.money{font-size:25px}.bet{font-size:16px}.badge{font-size:13px;padding:3px 10px}.actions{width:125%;margin-left:-12.5%;gap:5px}.actions button{height:48px;font-size:13px}.checkedState{font-size:14px;padding:8px 10px}
}
</style>
'''
          s=re.sub(r'<style>\s*/\* FINAL PLAYER UI .*?\*/.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Increase player UI by 1.5x'
          git push
