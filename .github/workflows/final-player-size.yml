name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style>
/* FINAL PLAYER UI 3X */
.player{width:420px}
.seat{padding:16px 22px 22px;border-radius:30px}
.avatar{width:105px;height:105px;margin:-52px auto 12px;font-size:51px}
.name{font-size:33px}.money{font-size:46px}.bet{font-size:29px}.badge{font-size:25px;padding:7px 18px;margin-top:9px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:13px;width:115%;margin-left:-7.5%}
.actions button{height:86px;min-width:0;font-size:25px;padding:0 5px;border-radius:15px}
.checkedState{margin-top:13px;padding:14px 18px;font-size:26px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:378px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:14px 18px 18px;border-radius:28px}.avatar{width:90px;height:90px;margin-top:-45px;font-size:44px}.name{font-size:30px}.money{font-size:42px}.bet{font-size:26px}.badge{font-size:22px;padding:6px 16px}.actions{width:115%;margin-left:-7.5%;gap:9px}.actions button{height:78px;font-size:23px}.checkedState{font-size:23px;padding:12px 16px}
}
</style>
'''
          s=re.sub(r'<style>\s*/\* FINAL PLAYER UI .*?\*/.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Increase player UI by another 1.5x'
          git push
