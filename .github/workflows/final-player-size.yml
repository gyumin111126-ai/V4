name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style>
/* FINAL PLAYER UI 4.5X */
.player{width:630px}
.seat{padding:24px 33px 33px;border-radius:45px}
.avatar{width:158px;height:158px;margin:-79px auto 18px;font-size:77px}
.name{font-size:50px}.money{font-size:69px}.bet{font-size:44px}.badge{font-size:38px;padding:10px 22px;margin-top:14px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;margin-top:20px;width:110%;margin-left:-5%}
.actions button{height:129px;min-width:0;font-size:38px;padding:0 7px;border-radius:23px}
.checkedState{margin-top:20px;padding:17px 23px;font-size:39px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:567px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:21px 27px 27px;border-radius:42px}.avatar{width:135px;height:135px;margin-top:-68px;font-size:66px}.name{font-size:45px}.money{font-size:63px}.bet{font-size:40px}.badge{font-size:34px;padding:8px 20px}.actions{width:110%;margin-left:-5%;gap:13px}.actions button{height:117px;font-size:34px}.checkedState{font-size:35px;padding:15px 20px}
}
</style>
'''
          s=re.sub(r'<style>\s*/\* FINAL PLAYER UI .*?\*/.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Increase player UI by another 1.5x'
          git push
