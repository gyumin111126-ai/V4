name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style>
/* FINAL PLAYER UI 2X */
.player{width:300px}
.seat{padding:12px 16px 16px;border-radius:24px}
.avatar{width:78px;height:78px;margin:-39px auto 9px;font-size:38px}
.name{font-size:25px}.money{font-size:35px}.bet{font-size:22px}.badge{font-size:19px;padding:5px 14px;margin-top:7px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px;width:120%;margin-left:-10%}
.actions button{height:66px;min-width:0;font-size:19px;padding:0 4px;border-radius:12px}
.checkedState{margin-top:10px;padding:11px 14px;font-size:20px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:270px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:10px 13px 13px;border-radius:22px}.avatar{width:72px;height:72px;margin-top:-36px;font-size:35px}.name{font-size:23px}.money{font-size:32px}.bet{font-size:20px}.badge{font-size:17px;padding:4px 12px}.actions{width:120%;margin-left:-10%;gap:7px}.actions button{height:60px;font-size:17px}.checkedState{font-size:18px;padding:10px 12px}
}
</style>
'''
          s=re.sub(r'<style>\s*/\* FINAL PLAYER UI .*?\*/.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Increase player UI size again'
          git push
