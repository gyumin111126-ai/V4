name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
<style>
/* FINAL PLAYER UI 6.75X */
.player{width:945px}
.seat{padding:36px 50px 50px;border-radius:68px}
.avatar{width:237px;height:237px;margin:-118px auto 27px;font-size:115px}
.name{font-size:75px}.money{font-size:104px}.bet{font-size:66px}.badge{font-size:57px;padding:15px 33px;margin-top:21px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:23px;margin-top:30px;width:110%;margin-left:-5%}
.actions button{height:194px;min-width:0;font-size:57px;padding:0 10px;border-radius:35px}
.checkedState{margin-top:30px;padding:26px 35px;font-size:59px}
.p5{bottom:13%}.p6{bottom:13%}
@media (min-width:801px) and (max-height:900px) and (orientation:landscape){
.player{width:850px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}
.seat{padding:32px 41px 41px;border-radius:63px}.avatar{width:203px;height:203px;margin-top:-102px;font-size:99px}.name{font-size:68px}.money{font-size:95px}.bet{font-size:60px}.badge{font-size:51px;padding:12px 30px}.actions{width:110%;margin-left:-5%;gap:20px}.actions button{height:176px;font-size:51px}.checkedState{font-size:53px;padding:23px 30px}
}
</style>
'''
          s=re.sub(r'<style>\s*/\* FINAL PLAYER UI .*?\*/.*?</style>\s*','',s,flags=re.S)
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Increase player UI by another 1.5x'
          git push
