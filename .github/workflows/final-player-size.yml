name: Final player size
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply player UI sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* FINAL PLAYER UI 1.8X */'
          if marker not in s:
              css='''\n<style>\n/* FINAL PLAYER UI 1.8X */\n.player{width:220px}\n.seat{padding:7px 9px 10px;border-radius:21px}\n.avatar{width:58px;height:58px;margin:-28px auto 6px;font-size:28px}\n.name{font-size:18px}.money{font-size:27px}.bet{font-size:17px}.badge{font-size:15px;padding:4px 12px;margin-top:5px}\n.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px;width:150%;margin-left:-25%}\n.actions button{height:52px;min-width:0;font-size:15px;padding:0 5px;border-radius:10px}\n.checkedState{margin-top:8px;padding:9px 11px;font-size:16px}\n.p5{bottom:13%}.p6{bottom:13%}\n@media (min-width:801px) and (max-height:900px) and (orientation:landscape){\n.player{width:180px}.p1{left:1%;top:.5%}.p2{right:1%;top:.5%}.p3{left:.2%;top:50%}.p4{right:.2%;top:50%}.p5{left:1%;bottom:13%}.p6{right:1%;bottom:13%}\n.seat{padding:6px 8px 8px;border-radius:19px}.avatar{width:50px;height:50px;margin-top:-25px;font-size:24px}.name{font-size:16px}.money{font-size:23px}.bet{font-size:15px}.badge{font-size:13px;padding:3px 10px}.actions{width:145%;margin-left:-22.5%;gap:5px}.actions button{height:47px;font-size:14px}.checkedState{font-size:14px;padding:8px}\n}\n@media (min-width:801px) and (max-height:700px) and (orientation:landscape){\n.player{width:165px}.p5,.p6{bottom:11%}.avatar{width:44px;height:44px;margin-top:-22px;font-size:21px}.name{font-size:14px}.money{font-size:20px}.bet{font-size:13px}.badge{font-size:11px}.actions button{height:42px;font-size:12px}.checkedState{font-size:12px}\n}\n</style>\n'''
              s=s.replace('</head>',css+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Resize player cards and horizontal action buttons'
          git push
