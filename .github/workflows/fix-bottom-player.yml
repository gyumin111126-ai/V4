name: Fix bottom players

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix bottom players position') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move bottom players upward
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '.p5{left:3%;bottom:1%;transform:rotate(0deg)}.p6{right:3%;bottom:1%;transform:rotate(0deg)}': '.p5{left:3%;bottom:7%;transform:rotate(0deg)}.p6{right:3%;bottom:7%;transform:rotate(0deg)}',
              '.p5{left:2%;bottom:1.5%}': '.p5{left:2%;bottom:7%}',
              '.p6{right:2%;bottom:1.5%}': '.p6{right:2%;bottom:7%}',
              '.p5,.p6{bottom:0.8%}': '.p5,.p6{bottom:7%}',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix bottom players position"
          git push
