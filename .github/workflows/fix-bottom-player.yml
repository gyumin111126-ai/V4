name: Fix player positions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix player positions') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep all players inside the screen and enlarge action buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          marker = '/* FINAL PLAYER LAYOUT V2 */'
          if marker not in s:
              s = s.replace('</style>', '''
          /* FINAL PLAYER LAYOUT V2 */
          @media (min-width: 801px) and (orientation: landscape) {
            .player { width: 100px !important; }
            .p1 { left: 4% !important; top: 2% !important; }
            .p2 { right: 4% !important; top: 2% !important; }
            .p3 { left: 4% !important; top: 47% !important; }
            .p4 { right: 4% !important; top: 47% !important; }
            .p5 { left: 4% !important; bottom: 20% !important; }
            .p6 { right: 4% !important; bottom: 20% !important; }
            .actions { width: 150% !important; margin-left: -25% !important; gap: 4px !important; }
            .actions button { height: 36px !important; font-size: 11px !important; padding: 0 4px !important; border-radius: 8px !important; }
          }
          @media (max-width: 800px) {
            .player { width: 100px !important; }
            .p1 { left: 3% !important; top: 2% !important; }
            .p2 { right: 3% !important; top: 2% !important; }
            .p3 { left: 3% !important; top: 45% !important; }
            .p4 { right: 3% !important; top: 45% !important; }
            .p5 { left: 3% !important; bottom: 16% !important; }
            .p6 { right: 3% !important; bottom: 16% !important; }
            .actions { width: 145% !important; margin-left: -22.5% !important; gap: 3px !important; }
            .actions button { height: 34px !important; font-size: 10px !important; padding: 0 3px !important; border-radius: 8px !important; }
          }
          </style>''')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix player positions"
          git push
