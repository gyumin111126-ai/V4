name: Adjust player cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    if: ${{ !contains(github.event.head_commit.message, 'Tune player cards') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply smaller player sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* BALANCED PLAYER CARDS V3 */'
          if marker not in s:
              css = '''
          /* BALANCED PLAYER CARDS V3 */
          @media (min-width: 801px) and (orientation: landscape) {
            .player { width: 105px !important; }
            .p1 { left: 3% !important; top: 2% !important; }
            .p2 { right: 3% !important; top: 2% !important; }
            .p3 { left: 1.5% !important; top: 48% !important; }
            .p4 { right: 1.5% !important; top: 48% !important; }
            .p5 { left: 3% !important; bottom: 11% !important; }
            .p6 { right: 3% !important; bottom: 11% !important; }
            .seat { padding: 3px 4px 4px !important; border-radius: 12px !important; }
            .avatar { width: 32px !important; height: 32px !important; margin-top: -17px !important; font-size: 16px !important; }
            .name { font-size: 10px !important; }
            .money { font-size: 14px !important; }
            .bet { font-size: 9px !important; }
            .badge { font-size: 8px !important; padding: 2px 6px !important; }
            .actions { width: 140% !important; margin-left: -20% !important; gap: 3px !important; margin-top: 4px !important; }
            .actions button { height: 31px !important; font-size: 8px !important; padding: 0 2px !important; border-radius: 7px !important; }
            .checkedState { margin-top: 4px !important; padding: 6px 7px !important; font-size: 9px !important; }
          }
          @media (max-width: 800px) {
            .player { width: 100px !important; }
            .p1 { left: 2% !important; top: 2% !important; }
            .p2 { right: 2% !important; top: 2% !important; }
            .p3 { left: 1% !important; top: 45% !important; }
            .p4 { right: 1% !important; top: 45% !important; }
            .p5 { left: 2% !important; bottom: 10% !important; }
            .p6 { right: 2% !important; bottom: 10% !important; }
            .seat { padding: 3px 4px 4px !important; border-radius: 12px !important; }
            .avatar { width: 30px !important; height: 30px !important; margin-top: -16px !important; font-size: 15px !important; }
            .name { font-size: 9px !important; }
            .money { font-size: 14px !important; }
            .bet { font-size: 8px !important; }
            .badge { font-size: 8px !important; padding: 2px 5px !important; }
            .actions { width: 138% !important; margin-left: -19% !important; gap: 3px !important; margin-top: 4px !important; }
            .actions button { height: 29px !important; font-size: 8px !important; padding: 0 2px !important; border-radius: 6px !important; }
            .checkedState { margin-top: 4px !important; padding: 5px 6px !important; font-size: 8px !important; }
          }
          '''
              s = s.replace('</style>', css + '\n</style>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tune player cards"
          git push
