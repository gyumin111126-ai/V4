name: Adjust player cards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  adjust:
    if: ${{ !contains(github.event.head_commit.message, 'Adjust player cards') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply balanced player sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* BALANCED PLAYER CARDS V2 */'
          if marker not in s:
              css = '''
          /* BALANCED PLAYER CARDS V2 */
          @media (min-width: 801px) and (orientation: landscape) {
            .player { width: 120px !important; }
            .p1 { left: 3% !important; top: 2% !important; }
            .p2 { right: 3% !important; top: 2% !important; }
            .p3 { left: 1.5% !important; top: 48% !important; }
            .p4 { right: 1.5% !important; top: 48% !important; }
            .p5 { left: 3% !important; bottom: 14% !important; }
            .p6 { right: 3% !important; bottom: 14% !important; }
            .seat { padding: 4px 5px 6px !important; border-radius: 14px !important; border-width: 1px !important; }
            .avatar { width: 36px !important; height: 36px !important; margin-top: -19px !important; font-size: 18px !important; }
            .name { font-size: 11px !important; }
            .money { font-size: 16px !important; }
            .bet { font-size: 10px !important; }
            .badge { font-size: 9px !important; padding: 2px 7px !important; }
            .actions { width: 150% !important; margin-left: -25% !important; gap: 4px !important; margin-top: 5px !important; }
            .actions button { height: 38px !important; font-size: 10px !important; padding: 0 3px !important; border-radius: 8px !important; border-width: 1px !important; }
            .checkedState { margin-top: 5px !important; padding: 7px 8px !important; font-size: 10px !important; }
          }
          @media (max-width: 800px) {
            .player { width: 112px !important; }
            .p1 { left: 2% !important; top: 2% !important; }
            .p2 { right: 2% !important; top: 2% !important; }
            .p3 { left: 1% !important; top: 45% !important; }
            .p4 { right: 1% !important; top: 45% !important; }
            .p5 { left: 2% !important; bottom: 13% !important; }
            .p6 { right: 2% !important; bottom: 13% !important; }
            .seat { padding: 4px 5px 6px !important; border-radius: 14px !important; }
            .avatar { width: 34px !important; height: 34px !important; margin-top: -18px !important; font-size: 17px !important; }
            .name { font-size: 10px !important; }
            .money { font-size: 15px !important; }
            .bet { font-size: 9px !important; }
            .badge { font-size: 9px !important; padding: 2px 6px !important; }
            .actions { width: 145% !important; margin-left: -22.5% !important; gap: 4px !important; margin-top: 5px !important; }
            .actions button { height: 36px !important; font-size: 9px !important; padding: 0 3px !important; border-radius: 7px !important; }
            .checkedState { margin-top: 5px !important; padding: 6px 7px !important; font-size: 9px !important; }
          }
          '''
              s = s.replace('</style>', css + '\n</style>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Adjust player cards"
          git push
